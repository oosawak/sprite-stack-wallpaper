[package]
name = "sprite-stack-wallpaper"
version = "0.1.0"
description = "Sprite Stack Wallpaper - 変形戦闘機のライブ壁紙"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
tauri-plugin-global-shortcut = "2"

[profile.release]
opt-level = 3
