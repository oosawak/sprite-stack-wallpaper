<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>スプライトスタック試作 v0.32 (three.js)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #123; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; touch-action: none; }
  #hud {
    position: fixed; left: 10px; top: 8px; color: #eaf2ff;
    font: 12px/1.5 monospace; text-shadow: 1px 1px 0 #0008; pointer-events: none;
    white-space: pre;
  }
  #help {
    position: fixed; left: 0; right: 0; bottom: 8px; text-align: center;
    color: #eaf2ff; font: 11px monospace; text-shadow: 1px 1px 0 #0008; pointer-events: none;
  }
  .btn {
    position: fixed; padding: 10px 14px;
    font: 14px monospace; color: #fff; border: 2px solid #fff6;
    border-radius: 8px; user-select: none; -webkit-user-select: none;
  }
  #btn { right: 12px; bottom: 36px; background: #f0580e; }
  #btn2 { right: 118px; bottom: 36px; background: #2e6da8; }
  #btn3 { right: 224px; bottom: 36px; background: #4a7c59; }
  #btn4 { right: 12px; bottom: 92px; background: #3366cc; }
  #btn5 { right: 118px; bottom: 92px; background: #a83a32; }
  #btn6 { right: 224px; bottom: 92px; background: #2c3e70; }
  #btn7 { right: 12px; bottom: 148px; background: #6a4a9c; display: none; }
  #cross { position: fixed; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px solid rgba(174,244,255,.9); border-radius: 50%; opacity: 0; pointer-events: none; z-index: 5; }
  #cross::after { content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: #aef4ff; border-radius: 50%; }
  #joy { position: fixed; left: 16px; bottom: 18px; width: 124px; height: 124px; border-radius: 50%; background: rgba(20,30,50,.35); border: 2px solid rgba(174,244,255,.45); display: none; z-index: 6; touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(174,244,255,.5); border: 2px solid rgba(255,255,255,.6); }
  @media (pointer: coarse) { #joy { display: block; } }
  body.wp #hud, body.wp #help, body.wp .btn, body.wp #joy, body.wp #radar, body.wp #cross { display: none !important; }
  #banner { position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%); padding: 10px 26px; background: rgba(8,12,24,.55); color: #eaf6ff; font-size: 19px; letter-spacing: .14em; border: 1px solid rgba(174,244,255,.35); border-radius: 6px; opacity: 0; transition: opacity .8s; pointer-events: none; z-index: 7; display: none; white-space: nowrap; }
  body.wp #banner { display: block; }
  #wpHint { position: fixed; right: 14px; bottom: 12px; color: rgba(234,246,255,.55); font-size: 13px; letter-spacing: .08em; display: none; z-index: 7; pointer-events: none; }
  body.wp #wpHint { display: block; }
  #radar {
    position: fixed; right: 10px; top: 10px; width: 118px; height: 118px;
    border-radius: 50%; border: 2px solid rgba(140,255,180,0.5); pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<div id="hud"></div>
<canvas id="radar" width="132" height="132"></canvas>
<div id="help">MOVE: STEER ・ HOLD: BOOST（中間・ロボットは離すと停止／中間はその場で回転） ・ TAP / T: 変形 ・ R: ROLL ・ V: VIEW ・ Z: SHOT ・ X: BOMB ・ N: NIGHT</div>
<div id="btn6" class="btn">夜</div>
<div id="btn5" class="btn">爆弾</div>
<div id="btn4" class="btn">弾</div>
<div id="btn3" class="btn">視点</div>
<div id="btn2" class="btn">ロール</div>
<div id="btn" class="btn">変形</div>
<div id="btn7" class="btn">跳</div>
<div id="cross"></div>
<div id="joy"><div id="joyKnob"></div></div>
<div id="banner"></div>
<div id="wpHint">Mキーで手動操縦</div>
<script type="module">
import * as THREE from 'three';
// ===== スプライトスタック試作 v0.32 (three.js 版) =====
// v0.32: 中間形態のミッションは、敵が正面に入るまで前進せず回転して探し、ガトリングは広めの角度で撃ち始める。アプリ版では数字キーで表示モニタを切り替える。
// v0.31: 壁紙の手動操縦はMキーを押したときだけ（30秒間）に変更。マウス移動やクリックでは操縦を奪わない。右下に「Mキーで手動操縦」の表示を出す。
// v0.30: 壁紙ミッションで中間形態とロボットが止まったままだったのを修正（両形態は長押し中だけ前進する作りで、自動操縦では前進しなかった）。ミッション中は自動で目標へ前進する。あわせてロボットのレーザー照準のカメラ高さの見積もりを修正。
// v0.29: 壁紙ミッションは戦闘機へ変形を強制せず、今の形態のまま戦う。中間形態はガトリング、ロボットは照準の上下を目標に合わせてレーザーで撃つ。
// v0.28: 壁紙モードに自動ミッションを追加。時間が来ると「ミッション ― 敵機を迎撃せよ／戦艦を撃沈せよ」の帯が出て、自機が自律的に出撃・解決し、哨戒に戻る。操作すると30秒だけ手動操縦に切り替わる（たまに遊べる壁紙）。
// v0.27: 壁紙モード（#wallpaper）を追加。UIを全部隠し、自動操縦で飛び続け、昼夜は本当の時計と連動し、約24秒ごとに自動で変形する。30fpsに抑えて負荷を下げてある。Wallpaper EngineやLively Wallpaper等のWeb壁紙として使える。
// v0.26: ロボットのFPSカメラを、少し後ろ・上から頭が画面下に映る位置にし、向きも少し下向きにした（足元側が見やすくなる）。ガードの盾が見えなかったので、濃さと網目を足し、敵弾を受けた瞬間に光るようにした。
// v0.25: ロボットのジャンプを垂直から後方ジャンプに変更。FPSでは足元の敵が見えず、真上に跳んでも見えないため、後ろへ跳んで距離を取り、足元の敵を視界に入れる動きにした。
// v0.24: R（ロールボタン）を形態別の防御アクションにした。戦闘機=バレルロール（従来）、中間形態=左右ランダムの回避（素早い横跳び＋傾き）、ロボット=ガード（長押しで盾を張り、敵弾を揺れなしで受ける）。ボタン表記も形態で切り替わる。
// v0.23: レーダー（地図）を左下から右上へ移した。スマホで左下のジョイスティックと重なるため。
// v0.22: ロールが最後まで回らないバグを修正（バンクの追従計算と混ざっていたため、途中で引き戻されていた）。スマホ操作を作り替え: 左下にジョイスティックを追加し、タッチの指の位置では操縦しないようにした（ボタンを押した指の動きや、離した後の残り入力で勝手に左右へ曲がる問題も解消）。
// v0.21: 高度の動きを形態で変えた。中間形態は垂直にスッと目標高度へ直行し、戦闘機は垂直速度に慣性がついてふわっと遅れて昇降する。
// v0.20: 戦闘機と中間形態で高度を上げ下げできるようにした（ポインタの上下が操縦桿、↑↓キーでも）。高度は8〜60、HUDにALT表示。
// v0.19: レーザーを照準（画面中央）のレイで狙う方式に変更。銃口が右手で中心からずれている分、ビームが照準の先の一点へ収束するので、照準と着弾が一致する。
// v0.18: ロボット形態ではカメラがゆっくり頭の位置へ寄ってFPSになり、画面中央にレーザー用の照準が出る。照準の上下はポインタ/↑↓で動き、レーザーは照準の方向へ飛ぶ。他形態へ変形すると追跡視点へ戻る。レーザーのビームを太く明るくし、銃も大きくした（v0.17で見えにくかったため）。
// v0.17: 武器を形態ごとに別物にした（戦闘機=連装砲、中間形態=ガトリング（撃ち続けると連射加速）、ロボット=右手のレーザー銃（熱管理つき））。ロボット専用に垂直ジャンプ（C/跳ボタン）と近接攻撃（X/近接ボタン、爆弾と切替）を追加。マウスクリックは攻撃に変更（変形はT/ダブルクリック/タッチのタップ）。
// v0.16: ロボット形態では機体を傾けず、まっすぐ立ったまま向きが変わるようにした。カメラもロボット形態では少し低く近づき、背後へしっかりつく。中間形態は傾き控えめに。止まっているロボットの揺れは静かなホバー調に。
// v0.16: ロボット形態では機体を傾けず、まっすぐ立ったまま向きが変わるようにした。カメラもロボット形態では少し低く近づき、背後へしっかりつく。中間形態は傾き控えめに。止まっているロボットの揺れは静かなホバー調に。
// v0.15: 戦艦をボクセル化し、同じボクセル（3,940個）の組み替えで巨大ロボットに変形するようにした。航行→変形→ロボット（自機を向いて5連拡散射撃）→変形→航行と潜航を交互に繰り返す。
// v0.14: 形態ごとに動きを差別化。中間形態も止まれるようにし、旋回を最速にしてその場で回転（ピボット）できるようにした。ロボットの旋回は中程度、戦闘機は従来どおり止まれず真っすぐ飛ぶ。
// v0.13: ロボット形態で止まれるようにした（長押しで移動、離すと減速してホバー）。
// v0.12: 自機の変形を Gemini 方式（対応ボクセルが飛んで組み替わる）に変更。敵は従来のバースト変形のまま。
// v0.11: 敵の変形戦闘機（暗色ステルス仕様、Gemini 生成 .vox）を3機追加。追尾・変形・射撃つき。
// v0.10: 機体を Gemini 生成の変形戦闘機3形態ボクセルに差し替え（戦闘機→中間形態→ロボットの3段変形）。
// v0.9: ロボットを仕様書どおり「戦闘機と同じボクセルの組み替え」に作り替え（robotVoxels）。
// v0.8: レーダー追加（左下、機首方向が上。島は緑、戦艦は赤、潜水中は青丸）。
// v0.7: 機体をボクセル化（平面スライスは斜めから見ると透けたため）。
//   実シャドウ（丸い影を廃止）、Zで弾・Xで爆弾、地形バリエーション、雲の増量、
//   前傾姿勢、翼端の飛行機雲、夜モード、潜って対空攻撃してくる戦艦。
//   three.js は同梱（three.module.js）。

const hud = document.getElementById('hud');
addEventListener('error', () => { hud.textContent = '読み込みに失敗しました'; });

// ---------- レーダー（左下、機首方向が上） ----------
const rg = document.getElementById('radar').getContext('2d');
function drawRadar() {
  const S = 132, C = S / 2, R = C - 4, RANGE = 1300, sc = R / RANGE;
  rg.clearRect(0, 0, S, S);
  rg.fillStyle = 'rgba(8,30,22,0.78)';
  rg.beginPath(); rg.arc(C, C, R, 0, 7); rg.fill();
  rg.strokeStyle = 'rgba(120,255,170,0.35)'; rg.lineWidth = 1;
  for (const f of [0.33, 0.66, 1]) { rg.beginPath(); rg.arc(C, C, R * f, 0, 7); rg.stroke(); }
  rg.beginPath();
  rg.moveTo(C - R, C); rg.lineTo(C + R, C);
  rg.moveTo(C, C - R); rg.lineTo(C, C + R);
  rg.stroke();
  const sw = (tNow * 0.9) % (Math.PI * 2); // スイープ
  rg.strokeStyle = 'rgba(140,255,180,0.75)';
  rg.beginPath(); rg.moveTo(C, C); rg.lineTo(C + Math.sin(sw) * R, C - Math.cos(sw) * R); rg.stroke();
  const plot = (wx, wz) => {
    const dx = wx - st.x, dz = wz - st.z;
    const f = dx * Math.cos(st.angle) + dz * Math.sin(st.angle);
    const r = -dx * Math.sin(st.angle) + dz * Math.cos(st.angle); // 右舷方向（符号を間違えると左右が鏡になる）
    let x = r * sc, y = -f * sc;
    const d = Math.hypot(x, y);
    if (d > R - 3) { x *= (R - 3) / d; y *= (R - 3) / d; }
    return [C + x, C + y];
  };
  rg.fillStyle = 'rgba(150,220,160,0.55)';
  for (const p of islandPts) { const [x, y] = plot(p.x, p.z); rg.fillRect(x - 1.5, y - 1.5, 3, 3); }
  for (const e of enemies) {
    if (!e.alive) continue;
    const [ex, ey] = plot(e.x, e.z);
    rg.fillStyle = '#c05cff';
    rg.beginPath(); rg.arc(ex, ey, 3, 0, 7); rg.fill();
  }
  const [sx, sy] = plot(shipGrp.position.x, shipGrp.position.z);
  if (ship.state === 'sunk') rg.fillStyle = '#888888';
  else if (ship.y < -8) rg.fillStyle = '#4db2ff';
  else rg.fillStyle = '#ff5340';
  if (ship.formT > 0.5) rg.fillRect(sx - 3.4, sy - 3.4, 6.8, 6.8);
  else { rg.beginPath(); rg.arc(sx, sy, 3.4, 0, 7); rg.fill(); }
  if (ship.y < -8 && ship.state !== 'sunk') {
    rg.strokeStyle = '#4db2ff';
    rg.beginPath(); rg.arc(sx, sy, 6, 0, 7); rg.stroke();
  }
  rg.fillStyle = '#ffffff';
  rg.beginPath(); rg.moveTo(C, C - 6); rg.lineTo(C - 4.4, C + 5); rg.lineTo(C + 4.4, C + 5); rg.closePath(); rg.fill();
}

// ---------- 毎フレーム ----------
let tNow = 0, last = performance.now();

    // 対空攻撃: 船形態は艦首から3点バースト、ロボット形態は肩口から5連拡散
    const pd = Math.hypot(st.x - ship.x, st.z - ship.z);
    if (ship.state === 'sail' && pd < 680) {
      ship.fireCd -= dt;
      if (ship.burstN > 0) {
        ship.burstT -= dt;
        if (ship.burstT <= 0) {
          ship.burstT = 0.13; ship.burstN--;
          const hx = Math.cos(ship.heading), hz = Math.sin(ship.heading);
          const from = new THREE.Vector3(ship.x + hx * 40, 13, ship.z + hz * 40);
          const to = new THREE.Vector3(st.x + (Math.random() - 0.5) * 60, st.alt + (Math.random() - 0.5) * 22, st.z + (Math.random() - 0.5) * 60);
          fireFrom(shells, from, to.sub(from).normalize().multiplyScalar(300), 3.2);
        }
      } else if (ship.fireCd <= 0) { ship.fireCd = 1.7 + Math.random() * 0.9; ship.burstN = 3; ship.burstT = 0; }
    }
    if (ship.state === 'robot' && pd < 950) {
      ship.fireCd -= dt;
      if (ship.fireCd <= 0) {
        ship.fireCd = 3.4;
        const from = new THREE.Vector3(ship.x, 56, ship.z);
        for (let k = 0; k < 5; k++) {
          const to = new THREE.Vector3(st.x + (Math.random() - 0.5) * 130, st.alt + (Math.random() - 0.5) * 30, st.z + (Math.random() - 0.5) * 130);
          fireFrom(shells, from, to.sub(from).normalize().multiplyScalar(320), 3.4);
        }
        spawnParticles(from, 8, ['#ffc23d', '#f0580e'], 10, 0.4, 3, 0.2);
      }
    }
  }
  // 対空砲弾の更新（近づくと弾けて揺れる。当たって死ぬことはない）
  for (const s of shells) {
    if (!s.active) continue;
    s.life -= dt;
    s.m.position.addScaledVector(s.vel, dt);
    const d = s.m.position.distanceTo(craft.position);
    if (guardingNow && d < 21) {
      st.shieldFlash = 1;
      spawnParticles(s.m.position.clone(), 8, ['#7fe7ff', '#aef4ff', '#ffffff'], 12, 0.4, 3, 0.2);
      st.shake = Math.max(st.shake, 0.12);
      s.active = false; s.m.visible = false;
    } else if (d < 15) {
      spawnParticles(s.m.position.clone(), 8, ['#ffd9a0', '#ffffff', '#999999'], 12, 0.5, 3.4, 0.2);
      st.shake = Math.max(st.shake, 0.55);
      s.active = false; s.m.visible = false;
    } else if (s.life <= 0 || s.m.position.y < 0) {
      spawnParticles(s.m.position.clone(), 4, ['#cccccc', '#ffffff'], 7, 0.4, 2.4, 0.2);
      s.active = false; s.m.visible = false;
    }
  }
  updateParticles(dt);

  // 雲（当たり判定なし。ゆっくり流れる）
  for (const cl of clouds) {
    cl.position.x += dt * 1.3;
    if (cl.position.x - st.x > 2600) cl.position.x -= 5200;
    if (cl.position.x - st.x < -2600) cl.position.x += 5200;
  }

  // 太陽と空（影は機体のそばに追従）
  sun.position.set(st.x + 70, 110, st.z + 40);
  sun.target.position.set(st.x, 0, st.z);
  sky.position.set(st.x, 0, st.z);

  // 昼夜の遷移
  st.night += (st.nightTarget - st.night) * Math.min(1, dt * 2.2);
  const nf = st.night;
  scene.background.lerpColors(DAY.bg, NIGHT.bg, nf);
  scene.fog.color.copy(scene.background);
  scene.fog.near = DAY.fogNear + (NIGHT.fogNear - DAY.fogNear) * nf;
  scene.fog.far = DAY.fogFar + (NIGHT.fogFar - DAY.fogFar) * nf;
  seaMat.color.lerpColors(DAY.sea, NIGHT.sea, nf);
  hemi.intensity = DAY.hemi + (NIGHT.hemi - DAY.hemi) * nf;
  sun.intensity = DAY.sun + (NIGHT.sun - DAY.sun) * nf;
  sun.color.lerpColors(DAY.sunCol, NIGHT.sunCol, nf);
  cloudMat.color.lerpColors(DAY.cloud, NIGHT.cloud, nf);
  starMat.opacity = nf * 0.95;
  moonMat.opacity = nf;

  // カメラ
  const back = fwd;
  const effAlt = st.alt + (st.jumpOff || 0);
  let wantPos, wantLook;
  if (st.view === 0) {
    if (st.form === 2) {
      wantPos = new THREE.Vector3(st.x - back.x * 40, effAlt + 16, st.z - back.z * 40);
      wantLook = new THREE.Vector3(st.x + back.x * 10, effAlt + 6, st.z + back.z * 10);
    } else {
      wantPos = new THREE.Vector3(st.x - back.x * 46, effAlt + 21, st.z - back.z * 46);
      wantLook = new THREE.Vector3(st.x + back.x * 14, effAlt + 1, st.z + back.z * 14);
    }
  } else {
    wantPos = new THREE.Vector3(st.x, effAlt + 95, st.z + 0.01);
    wantLook = new THREE.Vector3(st.x, effAlt, st.z);
  }
  // ロボット形態では頭の位置へゆっくり寄ってFPSになる。他形態では追跡視点へ戻る
  if (st.camBlend === undefined) st.camBlend = 0;
  const camTarget2 = (st.form === 2 && st.view === 0) ? 1 : 0;
  st.camBlend += (camTarget2 - st.camBlend) * Math.min(1, dt * 2.2);
  if (st.camBlend > 0.01) {
    const cp2 = Math.cos((st.aimPitch || 0) - 0.12), sp3 = Math.sin((st.aimPitch || 0) - 0.12);
    const aim = new THREE.Vector3(fwd.x * cp2, sp3, fwd.z * cp2);
    const headPos = new THREE.Vector3(st.x - fwd.x * 2, effAlt + 24.5, st.z - fwd.z * 2);
    wantPos.lerp(headPos, st.camBlend);
    wantLook.lerp(headPos.clone().addScaledVector(aim, 120), st.camBlend);
  }
  crossEl.style.opacity = st.camBlend.toFixed(2);
  const k = 1 - Math.exp(-dt * (st.form === 2 ? 6 : 4.5));
  camPos.lerp(wantPos, k);
  camTarget.lerp(wantLook, k);
  camera.position.copy(camPos);
  if (st.shake > 0.01) {
    camera.position.x += (Math.random() - 0.5) * st.shake * 2.4;
    camera.position.y += (Math.random() - 0.5) * st.shake * 2.4;
    st.shake *= Math.exp(-dt * 5);
  }
  camera.lookAt(camTarget);

  // HUD（戦艦の方角つき）
  const sdx = shipGrp.position.x - st.x, sdz = shipGrp.position.z - st.z;
  const sDist = Math.round(Math.hypot(sdx, sdz));
  let rel = Math.atan2(sdz, sdx) - st.angle;
  while (rel > Math.PI) rel -= Math.PI * 2;
  while (rel < -Math.PI) rel += Math.PI * 2;
  const arrow = ARROWS[((Math.round((rel + Math.PI / 8) / (Math.PI / 4)) % 8) + 8) % 8];
  const shipState = { sail: '航行中', diving: '潜航中', sub: '潜水中', surfacing: '浮上中', sunk: '撃沈!', toRobot: '変形中!', robot: 'ロボット形態', toShip: '変形中!' }[ship.state];
  if (st.form !== helpForm) {
    helpForm = st.form;
    helpEl.textContent = HELP_TEXTS[st.form];
    document.getElementById('btn5').textContent = st.form === 2 ? '近接' : '爆弾';
    document.getElementById('btn2').textContent = st.form === 0 ? 'ロール' : st.form === 1 ? '回避' : 'ガード';
  }
  const wantJumpBtn = st.form === 2 && st.morph < 0 ? 'block' : 'none';
  if (btn7El.style.display !== wantJumpBtn) btn7El.style.display = wantJumpBtn;
  hud.textContent = `SPRITE STACK PROTO v0.32 (three.js)\nFORM: ${FORM_NAMES[st.form]}${boosting ? (st.form === 0 ? '  BOOST!' : '  MOVE') : ''}${st.form > 0 && speed < 4 && st.morph < 0 ? '  STOP' : ''}${st.form < 2 ? '  ALT ' + Math.round(st.alt) : ''}${st.form === 2 ? '  HEAT ' + '▮'.repeat(Math.round((st.heat || 0) * 8)) + (st.over ? ' OVER!' : '') : ''}${st.roll >= 0 ? '  ROLL!' : ''}${st.dodgeT > 0 ? '  DODGE!' : ''}${guardingNow ? '  GUARD' : ''}  VIEW: ${st.view === 1 ? 'TOP' : (st.form === 2 ? 'FPS' : 'CHASE')}  ${nf > 0.5 ? 'NIGHT' : 'DAY'}\nSHIP: ${shipState} HP ${'♥'.repeat(Math.max(0, ship.hp))}  ${arrow} ${sDist}m  ENEMY: ${enemies.filter(e => e.alive).length}`;
  drawRadar();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
